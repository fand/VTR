[workspace]
members = ["vtr-player"]
default-members = [".", "vtr-player"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
rosc = "0.11.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }

[package]
name = "vtr-tap"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
chrono = "0.4.45"
clap = { workspace = true }
rosc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = "0.6.5"

[dev-dependencies]
tempfile = "3.27.0"
