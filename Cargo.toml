[workspace]
members = ["vtr-core", "vtr-tap", "vtr-player"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
rosc = "0.11.4"
serde = { version = "1.0.228", features = ["derive"] }
# float_roundtrip: the default float parse is best-effort (±1 ulp); the tap
# writes shortest-round-trip floats and playback promises exact fidelity, so
# the player must read back the identical f64.
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }
