name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tap:
    name: vtr-tap + vtr-player (cargo test)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  editor-checks:
    name: vtr-editor (lint / typecheck / unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vtr-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vtr-editor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  editor-e2e:
    name: vtr-editor (playwright e2e)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vtr-editor/package-lock.json
      - uses: Swatinem/rust-cache@v2
      # e2e specs point VTR_TAP_BIN / VTR_PLAYER_BIN at the debug binaries;
      # a workspace build produces both.
      - run: cargo build
      - run: npm ci
        working-directory: vtr-editor
      - run: npm run test:e2e
        working-directory: vtr-editor
