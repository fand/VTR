name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tap:
    name: osc-tap + vtr-player (cargo test)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: osc-tap
      - run: cargo test
        working-directory: osc-tap

  td-tests:
    name: td (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest
        working-directory: td

  editor-checks:
    name: osc-editor (lint / typecheck / unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: osc-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: osc-editor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  editor-e2e:
    name: osc-editor (playwright e2e)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: osc-editor/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: osc-tap
      # e2e specs point OSC_TAP_BIN / VTR_PLAYER_BIN at the debug binaries;
      # the workspace default-members build both.
      - run: cargo build
        working-directory: osc-tap
      - run: npm ci
        working-directory: osc-editor
      - run: npm run test:e2e
        working-directory: osc-editor
